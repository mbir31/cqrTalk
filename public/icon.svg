<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242b35" />
      <stop offset="50%" stop-color="#181d24" />
      <stop offset="100%" stop-color="#0f1318" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1712" />
      <stop offset="100%" stop-color="#050a08" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow/shadow -->
  <rect width="512" height="512" rx="100" fill="#0c0e12" />
  
  <!-- Antenna -->
  <rect x="150" y="40" width="28" height="110" rx="14" fill="#323a46" />
  <rect x="156" y="32" width="16" height="18" rx="6" fill="#10b981" />
  <!-- Volume Knob -->
  <rect x="330" y="55" width="44" height="60" rx="8" fill="#28303b" />
  <line x1="342" y1="60" x2="342" y2="105" stroke="#10b981" stroke-width="3" />
  <line x1="362" y1="60" x2="362" y2="105" stroke="#4b5563" stroke-width="2" />

  <!-- Radio Body -->
  <rect x="96" y="100" width="320" height="370" rx="36" fill="url(#chassis)" stroke="#374151" stroke-width="4" />
  
  <!-- Grip Textures -->
  <rect x="86" y="180" width="10" height="80" rx="4" fill="#4b5563" />
  <rect x="86" y="280" width="10" height="80" rx="4" fill="#4b5563" />
  <rect x="416" y="180" width="10" height="80" rx="4" fill="#4b5563" />
  <rect x="416" y="280" width="10" height="80" rx="4" fill="#4b5563" />

  <!-- LCD Screen Bezel -->
  <rect x="130" y="136" width="252" height="130" rx="16" fill="#111827" stroke="#1f2937" stroke-width="3" />
  <rect x="138" y="144" width="236" height="114" rx="10" fill="url(#screen)" stroke="#065f46" stroke-width="1.5" />

  <!-- LCD Content -->
  <text x="154" y="172" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="1">CH-01 [TX/RX]</text>
  <circle cx="346" cy="166" r="6" fill="#10b981" />
  <text x="154" y="212" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="2">cqrTalk®</text>
  <text x="154" y="238" fill="#059669" font-family="monospace" font-size="13" font-weight="bold">ONLINE // READY</text>

  <!-- PTT Speaker Grille / Tactile Mic Ring -->
  <circle cx="256" cy="360" r="70" fill="#181e26" stroke="#2a3441" stroke-width="5" />
  <circle cx="256" cy="360" r="54" fill="#11161d" stroke="#10b981" stroke-width="3" />
  
  <!-- Mic & Radio waves in PTT circle -->
  <path d="M256 332 v28 M244 346 a12 12 0 0 0 24 0 M256 364 v12 M246 376 h20" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M230 342 a36 36 0 0 0 0 20" stroke="#059669" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M282 342 a36 36 0 0 1 0 20" stroke="#059669" stroke-width="3.5" stroke-linecap="round" fill="none" />
</svg>
