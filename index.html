<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>cqrTalk®</title>
    <meta name="description" content="Production-quality touchscreen walkie-talkie PWA with real-time half-duplex voice communication and authoritative floor control." />
    <meta property="og:title" content="cqrTalk®" />
    <meta property="og:description" content="Production-quality touchscreen walkie-talkie PWA with real-time half-duplex voice communication and authoritative floor control." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#12161f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cqrTalk®" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0e1117] text-slate-100 antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only register service worker in production environments to avoid dev module caching conflicts
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port === '3000';
        if (!isLocalDev) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => {
              console.log('SW registration note:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
